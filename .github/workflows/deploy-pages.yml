name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы сайта
        uses: actions/checkout@v6

      - name: Настроить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовить файлы к публикации
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
